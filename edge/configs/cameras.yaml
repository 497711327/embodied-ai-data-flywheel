# Multi-camera capture configuration
# ─────────────────────────────────────────────────────────────────────────────
# Run device discovery first to find which /dev/videoN indices are available:
#
#   python tools/cli/list_cameras.py
#
# Then update device_id below accordingly.
# ─────────────────────────────────────────────────────────────────────────────

session:
  output_dir: data/raw      # MCAP files land under data/raw/<YYYYMMDD>/<uuid>/
  duration: 0               # Total recording seconds. 0 = run until Ctrl-C.
  segment_duration: 30      # Split MCAP every N seconds (0 = no splitting, single file).
  tags:
    location: ""            # e.g. parking_lot, warehouse, campus
    weather: ""             # e.g. sunny, overcast, rain
    operator: ""            # person running the session

cameras:
  # ── Camera 0 : front ────────────────────────────────────────────────────
  - name: camera_front
    device_id: 0
    width: 1280
    height: 720
    fps: 30
    jpeg_quality: 90        # 1–100. Lower = smaller MCAP, less detail.
    buffer_size: 4          # Frames held in queue between capture and writer.
                            # Increase if write spikes cause drops.

  # ── Camera 1 : left (uncomment when a second device is available) ────────
  # - name: camera_left
  #   device_id: 2          # USB cameras usually expose even indices (0,2,4…)
  #   width: 1280
  #   height: 720
  #   fps: 30
  #   jpeg_quality: 90
  #   buffer_size: 4

  # ── Camera 2 : rear (lower resolution, lower FPS) ────────────────────────
  # - name: camera_rear
  #   device_id: 4
  #   width: 640
  #   height: 480
  #   fps: 15
  #   jpeg_quality: 85
  #   buffer_size: 4

# ─────────────────────────────────────────────────────────────────────────────
# UDP streams — captured into the same MCAP file alongside camera frames.
# Topic in MCAP: /udp/<name>/raw
# Timestamp (ms since epoch) is stored in the MCAP log_time field for sync.
# ─────────────────────────────────────────────────────────────────────────────

udp_streams:
  # ── Radar front UDP ──────────────────────────────────────────────────────
  - name: radar_front
    bind_ip: "192.168.225.14"
    port: 5003
    # multicast_group: "239.1.1.1"  # Uncomment to join multicast
    # buffer_size: 8                  # Channel queue depth (default: 8)

  # ── Example: second stream on different port ─────────────────────────────
  # - name: radar_rear
  #   bind_ip: "0.0.0.0"
  #   port: 5001
