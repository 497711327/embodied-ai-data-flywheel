# UDP capture configuration
# ─────────────────────────────────────────────────────────────────────────────
# Each entry defines a UDP stream to capture. Packets are written into the same
# MCAP file alongside camera frames, with synchronized timestamps.
#
# The raw UDP payload is stored as binary data on the MCAP topic:
#   /udp/<name>/raw
#
# The first 8 bytes of each MCAP message's log_time field can be used to
# correlate with camera frames.
# ─────────────────────────────────────────────────────────────────────────────

udp_streams:
  # ── Radar UDP stream ─────────────────────────────────────────────────────
  - name: radar_front
    bind_ip: "0.0.0.0"
    port: 5000
    # multicast_group: "239.1.1.1"    # Uncomment to join a multicast group
    # buffer_size: 8                   # Channel queue depth (default: 8)

  # ── Example: second radar on different port ──────────────────────────────
